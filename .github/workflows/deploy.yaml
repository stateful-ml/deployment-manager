name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - prd
      - stg
    paths:
      - deployments.yaml

jobs:
  release-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: azure/setup-helm@v4.2.0
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config

      - name: Check kubectl connection
        run: kubectl get nodes

      - name: Load yaml
        id: load-yaml
        uses: mikefarah/yq@master
        with:
          cmd: yq eval -o=json . 'deployments.yaml'

      - name: Build version
        id: build-version
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '[.tag] + (.models | keys) | join("-")' 'deployments.yaml'

      # the reason its here is that im building prefect anyway.
      # TODO: build all images, including prefect's, in their respective repos
      - name: Build Docker image for service
        run: |
          docker build -t restful-ml:${{ fromJson(steps.load-yaml.outputs.result).tag }} "https://github.com/stateful-ml/stateful-ml.git#${{ fromJson(steps.load-yaml.outputs.result).tag }}:workspace" --file service/Dockerfile

      - name: Helm Install restful-ml
        run: |
          helm repo add stateful-ml https://stateful-ml.github.io/infra/
          helm install restful-ml stateful-ml/restful-ml -f ./deployments.yaml --set version=${{ steps.build-version.outputs.result }} --namespace ${{ github.ref_name }}


  release-prefect:
    runs-on: ubuntu-latest
    container:
      image: prefecthq/prefect:3.0.8-python3.11
    steps:
      ## alternative to container for `act`
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      # - run: pip install prefect==3.0.8

      - name: Checkout
        uses: actions/checkout@v3

      - name: Load yaml
        id: load-yaml
        uses: mikefarah/yq@master
        with:
          cmd: yq eval -o=json . 'deployments.yaml'

      - name: Build prefect deployment parameters
        id: build-deployment-params
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '.models | to_entries | map("--" + .key + " " + .value) | join(" ")' 'deployments.yaml'

      - name: Build version
        id: build-version
        uses: mikefarah/yq@master
        with:
          cmd: yq eval '[.tag] + (.models | keys) | join("-")' 'deployments.yaml'

      - name: Checkout tag in different repository
        uses: actions/checkout@v3
        with:
          repository: stateful-ml/stateful-ml
          ref: ${{ fromJson(steps.load-yaml.outputs.result).tag }}
          path: stateful-ml
          token: ${{ secrets.STATEFUL_ML_PAT }}

      - name: Deploy Prefect
        # wild, i NEED to ditch prefect
        run: |
          pip install --no-cache -r stateful-ml/workspace/shared/requirements.txt
          pip install --no-cache -r stateful-ml/workspace/pipelines/requirements.txt
          python stateful-ml/workspace/pipelines/deploy.py --env ${{ github.ref_name }} --version ${{ steps.build-version.outputs.result }} ${{ steps.build-deployment-params.outputs.result }}

      - name: Deduplicate staging deployments
        if: ${{ github.ref_name == 'prd' }}
        run: |
          python .github/workflows/deduplicate-deployments.py --version ${{ steps.build-version.outputs.result }}
